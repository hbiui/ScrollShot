name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'          # push a tag like v1.39.51 to trigger release
  workflow_dispatch:  # manual run button in Actions tab

permissions:
  contents: write     # needed to create GitHub Releases and upload assets

env:
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: '37.0.0'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.meta.outputs.apk_path }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            platform-tools

      - name: Build APK
        id: build
        shell: bash
        run: bash build.sh

      - name: Collect APK metadata
        id: meta
        shell: bash
        run: |
          # Extract version info from manifest (same logic as build.sh)
          VER_NAME=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/src/main/AndroidManifest.xml | head -1)
          PKG_NAME=$(sed -n 's/.*package="\([^"]*\)".*/\1/p' app/src/main/AndroidManifest.xml | head -1)
          APK_NAME="${PKG_NAME##*.}-${VER_NAME}-debug.apk"
          APK_PATH="build/manual/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "==> APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollshot-apk-v${{ steps.meta.outputs.version_name }}
          path: ${{ steps.meta.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')  # ONLY runs on tag push
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: scrollshot-apk-v${{ needs.build.outputs.version_name }}
          path: downloaded-apk/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScrollShot v${{ needs.build.outputs.version_name }}
          body: |
            ## ScrollShot v${{ needs.build.outputs.version_name }}

            滚动截屏 APK — 自动构建于 GitHub Actions。
          files: |
            downloaded-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
