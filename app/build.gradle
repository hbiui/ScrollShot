apply plugin: 'com.android.application'

android {
    namespace 'com.scrollshot'
    compileSdk 36
    defaultConfig {
        applicationId "com.scrollshot"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Third-party UI libraries (loaded from Google Maven / Maven Central):
    // AppCompat for backward-compatible Activity/Toolbar, Material Components
    // for Material 3 buttons, cards, and theming.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
}
